          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listtheattachmentsresponse'
    post:
      tags:
      - Agreement
      summary: Create an attachment
      description: 'The uid parameter in the endpoint is the uid associated with the agreement. To create an new non existing attachment a POST request is used.

        The body of the request should be multipart encoded.

        Three optional parameters name, description and isSignedContract can be specified.

        When present, the name should be an UTF-8 string smaller than 256 characters.

        When present, the description should be an UTF-8 string smaller than 1024 characters.

        When present, the isSignedContract should be a boolean. It indicates whether the attachment is the signed contract itself or not.'
      operationId: Createanattachment
      requestBody:
        description: ''
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                name:
                  type: string
                  example: name
                description:
                  type: string
                  example: description
                isSignedContract:
                  type: boolean
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createanattachmentresponse'

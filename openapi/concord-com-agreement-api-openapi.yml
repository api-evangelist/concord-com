      title: Field
      required:
      - id
      - name
      - value
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        value:
          type: string
      example:
        id: 1
        name: price
        value: 13 $
    Value:
      title: Value
      required:
      - name
      - value
      - height
      type: object
      properties:
        name:
          type: string
          deprecated: true
          description: Replaced by uuid
        value:
          type: string
        height:
          type: integer
          deprecated: true
          format: int32
        uuid:
          type: string
          format: uuid
      example:
        uuid: 47b7435e-59da-0145-a60a-41373d6e5f84
        name: pdf-field-345dc659-2db3-bbd9-1542f2a1c2f
        value: Lorem Ipsum
        height: 30

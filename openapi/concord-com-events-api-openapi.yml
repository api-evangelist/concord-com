security:
- ApiKeyAuthentication: []
tags:
- name: Events
  description: Events related API
paths:
  /organizations/{organizationId}/events:
    get:
      tags:
      - Events
      summary: Get List all organization events
      description: Only a user with the Administrator role can list events from an organization.
      operationId: GetListallorganizationevents
      parameters:
      - in: path
        name: organizationId
        description: Organization ID
        required: true
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        description: The start date (yyyy-MM-dd format). The range between `start` and `end` **must** be lesser or equals to 7 days.
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: '2024-01-01'
      - name: end
        in: query
        description: The end date (yyyy-MM-dd format). The range between `start` and `end` **must** be lesser or equals to 7 days.
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: '2024-01-07'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetListallorganizationeventsresponse'
components:
  schemas:
    GetListallorganizationeventsresponse:
      title: GetListallorganizationeventsresponse
      required:
      - events
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationEvent'
          description: ''
      example:
        events:
        - id: 128538
          createdAt: 1510657155000
          type: AGREEMENT_SIGN
          actor:
            name: John Doe
            id: 70
            type: USER
            hasAvatar: true
            email: john@doe.com
            job: none
            organization: Acme Corp
          event:
            name: Non-Disclosure Agreement
            id: 02xjNQD6nBXcaVLCJJGfN0
            type: AGREEMENT
            status: NEGOTIATION
        - id: 128536
          createdAt: 1510657127000
          type: AGREEMENT_INVITE
          actor:
            name: Jane Doe
            id: 293
            type: USER
            hasAvatar: false
            email: jane@doe.com
            job: ''
            organization: Acme Corp
          event:
            name: Non-Disclosure Agreement
            id: 02xjNQD6nBXcaVLCJJGfN0
            type: AGREEMENT
            status: NEGOTIATION
        - id: 128534
          createdAt: 1510657127000
          type: AGREEMENT_CREATE
          actor:
            name: John Doe
            id: 70
            type: USER
            hasAvatar: true
            email: john@doe.com
            job: none
            organization: Acme Corp
          event:
            name: Non-Disclosure Agreement
            id: 02xjNQD6nBXcaVLCJJGfN0
            type: AGREEMENT
            status: NEGOTIATION
        - id: 128532
          createdAt: 1510593506000
          type: AGREEMENT_VIEW
          actor:
            name: Jane Doe
            id: 293
            type: USER
            hasAvatar: false
            email: jane@doe.com
            job: ''
            organization: Acme Corp
          event:
            name: Non-Disclosure Agreement
            id: 02xjNQD6nBXcaVLCJJGfN0
            type: AGREEMENT
            status: NEGOTIATION
    EventDataOrganization:
      title: EventDataOrganization
      required:
      - name
      - id
      - type
      type: object
      properties:
        name:
          type: string
          description: The organization name
        id:
          type: string
          description: The organization ID
        type:
          type: string
          enum:
          - ORGANIZATION
      example:
        name: Acme Corp
        id: 24140
        type: ORGANIZATION
    EventDataAgreement:
      title: EventDataAgreement
      required:
      - name
      - id
      - type
      - status
      type: object
      properties:
        name:
          type: string
          description: The agreement title
        id:
          type: string
          description: The agreement UID
        type:
          type: string
          enum:
          - AGREEMENT
        status:
          type: string
      example:
        name: Non-Disclosure Agreement
        id: 02xjNQD6nBXcaVLCJJGfN0
        type: AGREEMENT
        status: NEGOTIATION
    EventDataUser:
      title: EventDataUser
      required:
      - name
      - id
      - type
      - hasAvatar
      - email
      - job
      - organization
      type: object
      properties:
        name:
          type: string
          description: The user name
        id:
          type: string
          description: The user ID
        type:
          type: string
          enum:
          - USER
        hasAvatar:
          type: boolean
        email:
          type: string
          format: email
        job:
          type: string
        organization:
          type: string
          description: The organization name
      example:
        name: John Doe
        id: 24140
        type: USER
        hasAvatar: false
        email: john@doe.com
        job: CEO
        organization: Acme Corp
    OrganizationEvent:
      title: Event
      required:
      - id
      - createdAt
      - type
      - actor
      - event
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - ORGANIZATION_ADD_USER
          - ORGANIZATION_ADD_SUBSIDIARY
          - AGREEMENT_CREATE
          - AGREEMENT_DELETE
          - AGREEMENT_INVITE
          - AGREEMENT_UPDATE
          - AGREEMENT_SIGN
          - AGREEMENT_DELAYED
          - AGREEMENT_JOIN
          - AGREEMENT_VIEW
          - AGREEMENT_OPENED_DOWNLOAD_LINK
        actor:
          oneOf:
          - $ref: '#/components/schemas/EventDataOrganization'
          - $ref: '#/components/schemas/EventDataUser'
        event:
          oneOf:
          - $ref: '#/components/schemas/EventDataAgreement'
          - $ref: '#/components/schemas/EventDataOrganization'
          - $ref: '#/components/schemas/EventDataUser'
      example:
        id: 128538
        createdAt: 1510657155000
        type: AGREEMENT_SIGN
        actor:
          name: John Doe
          id: 70
          type: USER
          hasAvatar: true
          email: john@doe.com
          job: none
          organization: Acme Corp
        event:
          name: Non-Disclosure Agreement
          id: 02xjNQD6nBXcaVLCJJGfN0
          type: AGREEMENT
          status: NEGOTIATION
  securitySchemes:
    ApiKeyAuthentication:
      type: apiKey
      in: header
      name: X-API-KEY
      description: 'Users authenticate themselves through the HTTP Header X-API-KEY. You can generate as many API Keys as needed from your Concord account.

        If the HTTP Header is missing or if the API Key is invalid, the HTTP Response will be 401 Unauthorized.'

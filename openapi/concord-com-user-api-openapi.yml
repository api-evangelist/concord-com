tags:
- name: User
  description: User related API
paths:
  /user/me:
    get:
      tags:
      - User
      summary: Get Information
      description: ''
      operationId: GetInformation
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInformationresponse'
  /user/me/preferences:
    get:
      tags:
      - User
      summary: Get Preferences
      description: ''
      operationId: GetPreferences
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsGetDto'
  /user/me/organizations:
    get:
      tags:
      - User
      summary: Get all User Organizations
      description: ''
      operationId: ListUserOrganizations
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - organizations
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserOrganizationDto'
                    description: ''

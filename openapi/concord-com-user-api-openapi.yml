          type: string
          description: ISO 639-1
          example: fr
        phone:
          type: string
          example: +33 1 00 00 00 00
        phoneCode:
          type: number
          example: 33
        notificationRules:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRuleDto'
